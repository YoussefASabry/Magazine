<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stars - Rising Stars Magazine</title>
    <meta name="description" content="Meet Rising Stars Language School's top students and star achievers. Featuring student achievements, academic competition winners, and more.">
    <meta property="og:title" content="Stars - Rising Stars Magazine">
    <meta property="og:description" content="Meet Rising Stars Language School's top students and star achievers.">
    <meta property="og:url" content="https://therisingtimes.vercel.app/">
    <meta property="og:image" content="https://therisingtimes.vercel.app/assets/images/logo1.png">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" type="image/png" href="assets/images/decorative.png?v=1">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/decorative.png?v=1">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/images/decorative.png?v=1">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/decorative.png?v=1">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <style>
        .students-header { background: linear-gradient(135deg, var(--primary-black) 0%, #2a2520 100%); padding: 70px 20px; text-align: center; }
        .students-header h1 { color: var(--primary-gold); text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
        .students-header p { color: rgba(255,255,255,0.7); }
        .filter-bar { display: flex; justify-content: center; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
        .filter-btn { padding: 8px 20px; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2); border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; transition: var(--transition); color: rgba(255,255,255,0.8); }
        .filter-btn.active, .filter-btn:hover { border-color: var(--primary-gold); background: var(--primary-gold); color: var(--primary-black); }
        .students-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
        @media (min-width: 1024px) { .students-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
        @media (max-width: 768px) { .students-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
        @media (max-width: 480px) { .students-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } }
        .student-card { background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(245,244,240,0.9) 100%); border-radius: 12px; padding: 20px; text-align: center; box-shadow: var(--shadow-md); transition: var(--transition); cursor: pointer; border: 1px solid rgba(0,0,0,0.06); min-width: 0; overflow-wrap: break-word; }
        .student-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .student-card.star { border: 3px solid var(--primary-gold); box-shadow: 0 0 20px rgba(201,168,76,0.6); }
        .student-card.star.teacher { background: linear-gradient(145deg, #722F37 0%, #4A1F29 100%); border-color: var(--primary-gold); }
        .student-card.star.secondary { background: linear-gradient(145deg, #1a1a1a 0%, #2d2d2d 100%); border-color: var(--primary-gold); box-shadow: 0 0 0 3px #333, 0 0 25px rgba(201,168,76,0.6); }
        .student-card.star.preparatory { background: linear-gradient(145deg, #1B4D3E 0%, #0F2E25 100%); border-color: var(--primary-gold); box-shadow: 0 0 0 3px #2A6B54, 0 0 25px rgba(201,168,76,0.6); }
        .student-card.star.primary { background: linear-gradient(145deg, #2C5282 0%, #1A3652 100%); border-color: var(--primary-gold); box-shadow: 0 0 0 3px #4299E1, 0 0 25px rgba(201,168,76,0.6); }
        .student-card.star.teacher { box-shadow: 0 0 0 3px #922B3E, 0 0 25px rgba(201,168,76,0.6); }
        .student-card.star h3 { color: var(--primary-gold); }
        .student-card.star .role { color: rgba(255,255,255,0.7); }
        .student-card.star .cse-role { color: #6A1B9A; background: white; }
        .student-card.star .class-badge { background: var(--primary-gold); color: var(--primary-black); }
        .student-card.teacher { background: linear-gradient(145deg, #722F37 0%, #4A1F29 100%); border: 2px solid #922B3E; color: #fff; }
        .student-card.teacher h3 { color: #fff; }
        .student-card.teacher .role { color: rgba(255,255,255,0.8); }
        .student-card.teacher .class-badge { background: #922B3E; color: #fff; }
        .student-card.secondary { background: linear-gradient(145deg, #1a1a1a 0%, #2d2d2d 100%); border: 2px solid #333; color: #fff; }
        .student-card.secondary h3 { color: #fff; }
        .student-card.secondary .class-badge { background: #333; color: #fff; }
        .student-card.preparatory { background: linear-gradient(145deg, #1B4D3E 0%, #0F2E25 100%); border: 2px solid #2A6B54; color: #fff; }
        .student-card.preparatory h3 { color: #fff; }
        .student-card.preparatory .class-badge { background: #2A6B54; color: #fff; }
        .student-card.primary { background: linear-gradient(145deg, #2C5282 0%, #1A3652 100%); border: 2px solid #4299E1; color: #fff; }
        .student-card.primary h3 { color: #fff; }
        .student-card.primary .class-badge { background: #4299E1; color: #fff; }
        .student-card.primary .role { color: rgba(255,255,255,0.7); }
        .student-card img { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-gold); margin: 0 auto 12px; box-shadow: 0 4px 16px rgba(201,168,76,0.3); display: block; }
        .student-card h3 { font-size: 14px; margin-bottom: 4px; }
        .student-card .cse-role { color: #6A1B9A; font-size: 10px; font-weight: 700; margin-top: 4px; background: white; padding: 3px 8px; border-radius: 10px; display: inline-block; }
        .student-card .top-role { color: #D4AF37; font-size: 10px; font-weight: 800; margin-top: 4px; background: white; padding: 3px 8px; border-radius: 10px; display: inline-block; text-transform: uppercase; }
        .student-card .role { font-size: 11px; color: rgba(255,255,255,0.7); font-style: italic; margin-bottom: 8px; }
        .student-card .class-badge { display: block; background: #8B3A5C; color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; margin: 0 auto 8px; width: fit-content; }
        .achievements { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 8px; }
        .achievement-tag { background: rgba(201,168,76,0.3); padding: 4px 10px; border-radius: 12px; font-size: 10px; font-weight: 600; }
        .student-card.star .achievement-tag { background: rgba(0,0,0,0.15); color: #fff; }
        .search-input { width: 100%; max-width: 300px; padding: 10px 16px; border: 2px solid var(--primary-gold); border-radius: 20px; font-size: 14px; outline: none; margin-bottom: 20px; }
        .search-input:focus { box-shadow: 0 0 10px rgba(201,168,76,0.4); }
        .cse-link-btn { display: inline-block; background: linear-gradient(135deg, #1a1a1a 0%, #333 100%); color: var(--primary-gold); padding: 12px 24px; border-radius: 25px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 16px; border: 2px solid var(--primary-gold); transition: var(--transition); }
        .cse-link-btn:hover { background: var(--primary-gold); color: #1a1a1a; transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="bg-stars"></div>

    <nav class="navbar">
        <div class="container flex justify-between items-center">
            <a href="index.html" class="logo"><img src="assets/images/logo.png" alt="The Rising Times logo"></a>
            <a href="javascript:void(0)" onclick="window.history.back()" class="btn btn-primary" style="padding:8px 16px;font-size:12px;">&larr; Back</a>
        </div>
    </nav>

    <div class="students-header">
        <h1>Stars</h1>
        <p>Celebrating excellence at Rising Stars Language School</p>
        <input type="text" id="searchInput" class="search-input" placeholder="Search students..." aria-label="Search students" oninput="renderStudents()">
        <div class="filter-bar">
            <button class="filter-btn active" type="button" onclick="filterStudents('all', this)">All</button>
            <button class="filter-btn" type="button" onclick="filterStudents('star', this)">★ Stars</button>
            <button class="filter-btn" type="button" onclick="filterStudents('teacher', this)">Teachers</button>
            <button class="filter-btn" type="button" onclick="filterStudents('student', this)">Students</button>
            <button class="filter-btn" type="button" onclick="filterStudents('Primary', this)">Primary</button>
            <button class="filter-btn" type="button" onclick="filterStudents('Preparatory', this)">Preparatory</button>
            <button class="filter-btn" type="button" onclick="filterStudents('Secondary', this)">Secondary</button>
        </div>
        <a href="cse-council.html" class="cse-link-btn">View CSE Council</a>
    </div>

    <section class="section">
        <div class="container">
            <div class="students-grid" id="studentsGrid">
                <div class="loading-block" role="status">Loading students…</div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p><strong>THE RISING TIMES NEWS</strong></p>
            <p>Rising Stars Language School</p>
            <p>&copy; 2026 All Rights Reserved</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script>
        let currentFilter = 'all';
        let priorityOrder = new Map();

        function filterStudents(filter, button) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach((item) => item.classList.remove('active'));
            button?.classList.add('active');
            renderStudents();
        }

        function getCseRole(student) {
            const council = DataStore.getCSECouncil();
            const titles = {
                president: 'President',
                vicePresident: 'Vice President',
                science: 'Science',
                religiousCulture: 'Religious & Culture',
                art: 'Art',
                social: 'Social',
                sports: 'Sports'
            };
            for (const stage of ['secondary', 'preparatory', 'primary']) {
                for (const [roleKey, roleName] of Object.entries(council.stages[stage] || {})) {
                    if (roleName === student.name) {
                        return `${stage.charAt(0).toUpperCase() + stage.slice(1)} ${titles[roleKey] || roleKey} Rep`;
                    }
                }
            }
            return '';
        }

        function countEvents(student) {
            return DataStore.getEvents().reduce((count, event) => {
                return (
                    count +
                    (event.elements || []).reduce((elementCount, element) => {
                        const people = element.students || element.organizers || [];
                        return (
                            elementCount +
                            people.filter(
                                (person) =>
                                    (student.uuid && person.student_id === student.uuid) ||
                                    person.name?.toLowerCase() === student.name.toLowerCase()
                            ).length
                        );
                    }, 0)
                );
            }, 0);
        }

        function renderStudents() {
            const grid = document.getElementById('studentsGrid');
            let students = DataStore.getStudents();
            const searchTerm = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
            if (searchTerm) {
                students = students.filter((student) => student.name.toLowerCase().includes(searchTerm));
            }

            if (currentFilter === 'star') students = students.filter((student) => student.star && student.type === 'student');
            else if (currentFilter === 'teacher') students = students.filter((student) => student.type === 'teacher');
            else if (currentFilter === 'student') students = students.filter((student) => student.type === 'student');
            else if (['Primary', 'Preparatory', 'Secondary'].includes(currentFilter)) {
                students = students.filter((student) => student.class === currentFilter);
            }

            const classOrder = { Secondary: 0, Preparatory: 1, Primary: 2 };
            const topNames = new Set(DataStore.getTopStudents().map((item) => item.name));
            const council = DataStore.getCSECouncil();
            const cseNames = new Set(
                Object.values(council.stages || {}).flatMap((roles) => Object.values(roles || {})).filter(Boolean)
            );

            const rank = (student) => {
                if (priorityOrder.has(student.slug)) return priorityOrder.get(student.slug);
                if (topNames.has(student.name)) return 100;
                if (cseNames.has(student.name)) return 200;
                if (student.star && student.type === 'student') return 300;
                return 400;
            };

            students.sort((a, b) => {
                const rankDiff = rank(a) - rank(b);
                if (rankDiff !== 0) return rankDiff;
                const classDiff = (classOrder[a.class] ?? 3) - (classOrder[b.class] ?? 3);
                if (classDiff !== 0) return classDiff;
                const eventDiff = countEvents(b) - countEvents(a);
                if (eventDiff !== 0) return eventDiff;
                return a.name.localeCompare(b.name);
            });

            if (!students.length) {
                grid.innerHTML = '<p class="empty-state" style="grid-column:1/-1;">No students found.</p>';
                return;
            }

            grid.innerHTML = students
                .map((student) => {
                    const isStar = student.star && student.type === 'student';
                    const isTeacher = student.type === 'teacher';
                    const studentClass = student.class || 'Student';
                    const cseRole = getCseRole(student);
                    const achievements = (student.achievements || [])
                        .map((achievement) => `<span class="achievement-tag">${Utils.escapeHtml(achievement)}</span>`)
                        .join('');

                    let className = 'student-card';
                    if (isStar) className += ' star';
                    if (isTeacher) className += ' teacher';
                    else if (studentClass) className += ` ${studentClass.toLowerCase()}`;

                    return `
                        <div class="${className}" onclick="viewStudent('${Utils.escapeAttr(student.slug)}')">
                            <img src="${Utils.escapeAttr(student.image || '')}" alt="${Utils.escapeAttr(student.name)}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27140%27 height=%27140%27%3E%3Ccircle cx=%2770%27 cy=%2770%27 r=%2770%27 fill=%27%23ddd%27/%3E%3C/svg%3E'">
                            ${!isTeacher ? `<span class="class-badge">${Utils.escapeHtml(studentClass)}</span>` : ''}
                            <h3>${Utils.escapeHtml(student.name)}${isStar ? '<span class="star-badge">★ STAR</span>' : ''}</h3>
                            ${student.is_top ? `<p class="top-role">${Utils.escapeHtml(student.top_role || 'Top Student')}</p>` : ''}
                            ${cseRole ? `<p class="cse-role">${Utils.escapeHtml(cseRole)}</p>` : ''}
                            <p class="role">${Utils.escapeHtml(student.role || '')}</p>
                            ${achievements ? `<div class="achievements">${achievements}</div>` : ''}
                        </div>`;
                })
                .join('');
        }

        function viewStudent(slug) {
            window.location.href = `student.html?slug=${encodeURIComponent(slug)}`;
        }

        async function init() {
            try {
                await DataStore.load();
                DataStore.applySiteMeta();
                priorityOrder = new Map(
                    DataStore.getPriorityStudents().map((student, index) => [student.slug, index])
                );
                renderStudents();
            } catch (error) {
                document.getElementById('studentsGrid').innerHTML = `<p class="error-state" style="grid-column:1/-1;">${Utils.escapeHtml(error.message)}</p>`;
            }
        }

        init();
    </script>
</body>
</html>
