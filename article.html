<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rising Times | Rising Stars Magazine</title>
    <meta name="description" content="Read the latest news, achievements, and event coverage from Rising Stars Language School. Student stories, competitions, cultural events and more.">
    <meta property="og:title" content="The Rising Times - Rising Stars News">
    <meta property="og:description" content="Stay updated with the latest news and achievements from Rising Stars Language School.">
    <meta property="og:url" content="https://therisingtimes.vercel.app/">
    <meta property="og:image" content="https://therisingtimes.vercel.app/assets/images/logo1.png">
    <meta property="og:type" content="article">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" type="image/png" href="assets/images/decorative.png?v=1">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/decorative.png?v=1">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/images/decorative.png?v=1">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/decorative.png?v=1">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
    <style>
        .article-header { text-align: center; padding: 70px 20px; background: linear-gradient(135deg, var(--primary-black) 0%, #2a2520 100%); }
        .article-header h1 { color: var(--primary-gold); }
        .article-meta { font-size: 14px; color: rgba(255,255,255,0.6); margin-top: 16px; }
        .article-content { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
        .article-image-text { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: center; margin-bottom: 40px; }
        .article-image-text.reverse { direction: rtl; }
        .article-image-text.reverse > * { direction: ltr; }
        .article-image-text img { width: 100%; border-radius: 12px; box-shadow: var(--shadow-md); }
        .article-full-image img { width: 100%; max-height: 500px; object-fit: cover; border-radius: 12px; margin-bottom: 30px; box-shadow: var(--shadow-lg); }
        .slideshow { position: relative; margin-bottom: 40px; }
        .slideshow-images { display: flex; transition: transform 0.5s ease; overflow: hidden; border-radius: 12px; background: #f0f0f0; width: 100%; }
        .slideshow-images img { width: 100%; height: auto; max-height: 500px; object-fit: contain; flex-shrink: 0; background: transparent; }
        .slideshow-nav { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .slideshow-dot { width: 12px; height: 12px; border-radius: 50%; background: #ddd; cursor: pointer; border: none; padding: 0; transition: var(--transition); }
        .slideshow-dot.active { background: var(--primary-gold); }
        .slideshow-arrows { position: absolute; top: 50%; transform: translateY(-50%); width: 100%; display: flex; justify-content: space-between; padding: 0 10px; pointer-events: none; }
        .slideshow-arrow { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.9); border: none; cursor: pointer; font-size: 18px; pointer-events: auto; transition: var(--transition); }
        .slideshow-arrow:hover { background: var(--primary-gold); }
        .article-video { position: relative; padding-bottom: 56.25%; height: 0; margin-bottom: 30px; border-radius: 12px; overflow: hidden; }
        .article-video iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .article-quote { background: var(--bg-white); padding: 24px; border-radius: 12px; border-left: 4px solid var(--primary-gold); margin: 30px 0; font-style: italic; font-size: 18px; }
        .article-quote .quote-author { font-size: 14px; color: #666; margin-top: 12px; font-style: normal; font-weight: 600; }
        .article-students { background: rgba(201,168,76,0.15); padding: 24px; border-radius: 12px; margin: 30px 0; }
        .article-students h3 { font-size: 14px; margin-bottom: 16px; }
        .article-students-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .students-group { margin-bottom: 20px; }
        .group-separator { font-size: 12px; font-weight: 700; color: #555; padding: 8px 12px; margin-bottom: 10px; background: rgba(0,0,0,0.05); border-radius: 4px; }
        .article-organizers { background: rgba(220,20,60,0.1); padding: 24px; border-radius: 12px; margin: 30px 0; border-left: 4px solid #DC143C; }
        .article-organizers h3 { font-size: 14px; margin-bottom: 16px; color: #DC143C; }
        .article-organizers-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .student-card-mini { display: flex; align-items: center; gap: 16px; padding: 12px; background: var(--bg-white); border-radius: 8px; margin-bottom: 12px; cursor: pointer; transition: var(--transition); }
        .student-card-mini:hover { transform: translateX(8px); }
        .student-card-mini img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
        .student-card-mini-info { flex: 1; }
        .student-card-mini-name { font-weight: 700; font-size: 14px; }
        .student-card-mini-role { font-size: 12px; color: #666; }
        .article-text {
            background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(245,244,240,0.9) 100%);
            border-radius: 12px;
            padding: 24px;
            margin: 20px 0;
            border-left: 4px solid var(--primary-gold);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .article-text p { font-size: 16px; line-height: 1.8; color: #333; }
        .article-text ul, .article-text ol { margin: 12px 0 12px 22px; line-height: 1.8; color: #333; }
        .article-text h2, .article-text h3 { margin: 20px 0 10px; }
        @media (max-width: 768px) {
            .article-image-text { grid-template-columns: 1fr; }
            .article-image-text.reverse { direction: ltr; }
            .article-students, .article-organizers { padding: 12px; }
            .article-students h3, .article-organizers h3 { font-size: 12px; margin-bottom: 12px; }
            .article-students-grid, .article-organizers-grid { gap: 8px; }
            .student-card-mini { padding: 6px; gap: 8px; }
            .student-card-mini img { width: 32px; height: 32px; }
            .student-card-mini-name { font-size: 12px; }
            .student-card-mini-role { font-size: 10px; }
            .students-group { margin-bottom: 16px; }
            .group-separator { font-size: 10px; padding: 4px 8px; margin-bottom: 8px; }
        }
    </style>
</head>
<body>
    <div class="bg-stars"></div>

    <nav class="navbar">
        <div class="container flex justify-between items-center">
            <a href="index.html" class="logo"><img src="assets/images/logo.png" alt="The Rising Times logo"></a>
            <a href="javascript:void(0)" onclick="window.history.back()" class="btn btn-primary" style="padding:8px 16px;font-size:12px;">&larr; Back</a>
        </div>
    </nav>

    <article>
        <div class="article-header">
            <h1 id="articleTitle">Loading…</h1>
            <p class="article-meta" id="articleMeta">Published in The Rising Times News</p>
        </div>
        <div class="article-content" id="articleContent">
            <div class="loading-block" role="status">Loading article…</div>
        </div>
    </article>

    <footer class="footer">
        <div class="container">
            <p><strong>THE RISING TIMES NEWS</strong></p>
            <p>Rising Stars Language School | Futures Education System</p>
            <p>&copy; 2026 All Rights Reserved</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/data.js"></script>
    <script>
        const articleId = Utils.queryParam('id');

        function setMeta(attribute, name, content) {
            if (!content) return;
            let tag = document.querySelector(`meta[${attribute}="${name}"]`);
            if (!tag) {
                tag = document.createElement('meta');
                tag.setAttribute(attribute, name);
                document.head.appendChild(tag);
            }
            tag.setAttribute('content', content);
        }

        function renderPersonCard(person, isOrganizer = false) {
            const student = DataStore.getStudent(person.slug || person.name);
            const name = person.name || student?.name || 'Student';
            const image = person.image || student?.image || '';
            const role = person.role || student?.role || (isOrganizer ? 'Teacher' : 'Student');
            const achievement = person.achievement ? ` - ${person.achievement}` : '';
            const star = person.star || student?.star ? ' ★' : '';
            const slug = student?.slug || person.slug || name;

            return `
                <div class="student-card-mini" onclick="viewStudent('${Utils.escapeAttr(slug)}')">
                    <img src="${Utils.escapeAttr(image)}" alt="${Utils.escapeAttr(name)}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2750%27 height=%2750%27%3E%3Ccircle cx=%2725%27 cy=%2725%27 r=%2725%27 fill=%27%23ddd%27/%3E%3C/svg%3E'">
                    <div class="student-card-mini-info">
                        <div class="student-card-mini-name">${Utils.escapeHtml(name)}${star}</div>
                        <div class="student-card-mini-role">${Utils.escapeHtml(role)}${Utils.escapeHtml(achievement)}</div>
                    </div>
                </div>`;
        }

        function renderStudents(element) {
            const people = element.students || [];
            if (!people.length) return '';

            const groups = { Secondary: [], Preparatory: [], Primary: [], Other: [] };
            for (const person of people) {
                const student = DataStore.getStudent(person.slug || person.name);
                const studentClass = student?.class || person.class || '';
                if (student?.type === 'teacher' || studentClass === 'Teacher') groups.Other.push(person);
                else if (groups[studentClass]) groups[studentClass].push(person);
                else groups.Other.push(person);
            }

            const colors = { Secondary: '#333', Preparatory: '#2A6B54', Primary: '#4299E1', Other: '#8B3A5C' };
            const sections = Object.entries(groups)
                .filter(([, members]) => members.length)
                .map(
                    ([title, members]) => `
                        <div class="students-group">
                            <div class="group-separator" style="border-left: 4px solid ${colors[title]};">${title}</div>
                            <div class="article-students-grid">${members.map((person) => renderPersonCard(person)).join('')}</div>
                        </div>`
                )
                .join('');

            return `<div class="article-students"><h3>Students in this article:</h3>${sections}</div>`;
        }

        function renderOrganizers(element) {
            const people = element.organizers || [];
            if (!people.length) return '';
            return `
                <div class="article-organizers">
                    <h3>Organizers / Teachers:</h3>
                    <div class="article-organizers-grid">${people.map((person) => renderPersonCard(person, true)).join('')}</div>
                </div>`;
        }

        function renderVideo(value) {
            const ids = String(value || '')
                .split(',')
                .map((item) => Utils.youtubeEmbedUrl(item))
                .filter(Boolean);
            if (!ids.length) return '';

            if (ids.length > 1) {
                return `<div class="article-video-row" style="display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:30px 0;">${ids
                    .map(
                        (url) => `<div style="position:relative;padding-bottom:56.25%;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-md);"><iframe src="${Utils.escapeAttr(url)}" title="YouTube video player" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>`
                    )
                    .join('')}</div>`;
            }

            return `<div class="article-video"><iframe src="${Utils.escapeAttr(ids[0])}" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen loading="lazy"></iframe></div>`;
        }

        function renderSlideshow(element, index) {
            const images = (element.images || []).filter(Boolean);
            if (!images.length) return '';
            const slideId = `slideshow-${index}`;
            const slides = images
                .map(
                    (image, imageIndex) =>
                        `<img src="${Utils.escapeAttr(image)}" alt="Slide ${imageIndex + 1}" class="slide" style="display:${imageIndex === 0 ? 'block' : 'none'}" loading="lazy">`
                )
                .join('');
            const dots = images
                .map(
                    (_, imageIndex) =>
                        `<button class="slideshow-dot ${imageIndex === 0 ? 'active' : ''}" type="button" aria-label="Go to slide ${imageIndex + 1}" data-slide="${slideId}" data-index="${imageIndex}" onclick="goSlide('${slideId}', ${imageIndex})"></button>`
                )
                .join('');

            return `
                <div class="slideshow">
                    <div class="slideshow-images" id="${slideId}">${slides}</div>
                    <div class="slideshow-arrows">
                        <button class="slideshow-arrow" type="button" aria-label="Previous slide" onclick="prevSlide('${slideId}')">&lsaquo;</button>
                        <button class="slideshow-arrow" type="button" aria-label="Next slide" onclick="nextSlide('${slideId}')">&rsaquo;</button>
                    </div>
                    <div class="slideshow-nav">${dots}</div>
                    ${element.caption ? `<p style="text-align:center;color:#666;margin-top:12px;">${Utils.escapeHtml(element.caption)}</p>` : ''}
                </div>`;
        }

        function renderArticle(article) {
            document.getElementById('articleTitle').textContent = article.title;
            document.getElementById('articleMeta').textContent = `Published in The Rising Times News | ${article.category || 'News'}${article.date ? ` | ${article.date}` : ''}`;
            document.title = article.seo_title || `${article.title} | The Rising Times`;
            const excerpt = article.seo_description || DataStore.getEventExcerpt(article);
            setMeta('name', 'description', excerpt);
            setMeta('property', 'og:title', article.title);
            setMeta('property', 'og:description', excerpt);
            setMeta('property', 'og:image', article.og_image_url || DataStore.getEventPreviewImage(article));
            setMeta('property', 'og:url', window.location.href);

            let html = '';
            (article.elements || []).forEach((element, index) => {
                switch (element.type) {
                    case 'text':
                        if (element.content) {
                            html += `<div class="article-text rich-text">${Utils.sanitize(element.content)}</div>`;
                        }
                        break;
                    case 'image':
                        if (element.image) {
                            const caption = element.caption
                                ? `<p style="color:#666;font-size:14px;">${Utils.escapeHtml(element.caption)}</p>`
                                : '';
                            if (element.align === 'full' || !element.align) {
                                html += `<div class="article-full-image"><img src="${Utils.escapeAttr(element.image)}" alt="${Utils.escapeAttr(element.caption || article.title)}" loading="lazy" onerror="this.parentElement.style.display='none'"></div>${caption}`;
                            } else {
                                const reverse = element.align === 'right' ? ' reverse' : '';
                                html += `<div class="article-image-text${reverse}"><img src="${Utils.escapeAttr(element.image)}" alt="${Utils.escapeAttr(element.caption || article.title)}" loading="lazy" onerror="this.parentElement.style.display='none'"><div>${caption}</div></div>`;
                            }
                        }
                        break;
                    case 'slideshow':
                        html += renderSlideshow(element, index);
                        break;
                    case 'video':
                        html += renderVideo(element.video);
                        break;
                    case 'quote':
                        if (element.quote) {
                            html += `<div class="article-quote">"${Utils.escapeHtml(element.quote)}"${element.author ? `<div class="quote-author">— ${Utils.escapeHtml(element.author)}</div>` : ''}</div>`;
                        }
                        break;
                    case 'students':
                        html += renderStudents(element);
                        break;
                    case 'organizers':
                        html += renderOrganizers(element);
                        break;
                }
            });

            document.getElementById('articleContent').innerHTML =
                html || '<p class="empty-state">This article has no content yet.</p>';
        }

        function goSlide(slideId, index) {
            const container = document.getElementById(slideId);
            if (!container) return;
            const slides = container.querySelectorAll('.slide');
            const dots = document.querySelectorAll(`.slideshow-dot[data-slide="${slideId}"]`);
            if (!slides.length) return;
            const current = ((index % slides.length) + slides.length) % slides.length;
            slides.forEach((slide, slideIndex) => {
                slide.style.display = slideIndex === current ? 'block' : 'none';
            });
            dots.forEach((dot, dotIndex) => {
                dot.classList.toggle('active', dotIndex === current);
                dot.setAttribute('aria-selected', dotIndex === current ? 'true' : 'false');
            });
        }

        function nextSlide(slideId) {
            const dots = document.querySelectorAll(`.slideshow-dot[data-slide="${slideId}"]`);
            let current = 0;
            dots.forEach((dot, index) => {
                if (dot.classList.contains('active')) current = index;
            });
            goSlide(slideId, current + 1);
        }

        function prevSlide(slideId) {
            const dots = document.querySelectorAll(`.slideshow-dot[data-slide="${slideId}"]`);
            let current = 0;
            dots.forEach((dot, index) => {
                if (dot.classList.contains('active')) current = index;
            });
            goSlide(slideId, current - 1);
        }

        function viewStudent(slugOrName) {
            const student = DataStore.getStudent(slugOrName);
            window.location.href = student
                ? `student.html?slug=${encodeURIComponent(student.slug)}`
                : `student.html?name=${encodeURIComponent(slugOrName)}`;
        }

        async function init() {
            try {
                await DataStore.load();
                DataStore.applySiteMeta();
                const article = DataStore.getEvent(articleId);
                if (!article) {
                    document.getElementById('articleTitle').textContent = 'Article Not Found';
                    document.getElementById('articleMeta').textContent = 'The requested article could not be found.';
                    document.getElementById('articleContent').innerHTML =
                        '<p class="empty-state">The requested article could not be found. <a href="index.html">Return to the magazine</a>.</p>';
                    return;
                }
                renderArticle(article);
            } catch (error) {
                document.getElementById('articleTitle').textContent = 'Could Not Load Article';
                document.getElementById('articleContent').innerHTML = `<p class="error-state">${Utils.escapeHtml(error.message)}</p>`;
            }
        }

        init();
    </script>
</body>
</html>
